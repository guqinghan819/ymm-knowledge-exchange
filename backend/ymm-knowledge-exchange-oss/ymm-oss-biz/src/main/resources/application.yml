server:
  port: 8098

spring:
  profiles:
    active: dev
  data:
    redis:
      database: 0
      host: "${REDIS_HOST:localhost}"
      port: 6379
      password: "${REDIS_PASSWORD:}"
      timeout: 5000
      #连接池配置
      lettuce:
        pool:
          max-active: 200 # 连接池最大连接数
          max-wait: -1ms # 连接池最大阻塞等待时间（使用负值表示没有限制）
          min-idle: 0 # 连接池中的最小空闲连接
          max-idle: 10 # 连接池中的最大空闲连接
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
strategy:
  type: cos
cos:
  video:
    multipart:
      enabled: true
      threshold-bytes: 20971520
      max-file-size-bytes: 524288000
      part-size-bytes: 8388608
      signature-ttl-seconds: 900
      task-ttl-hours: 24
      complete-lock-seconds: 30
