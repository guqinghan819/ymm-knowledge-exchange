server:
  port: 8101
spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 150MB
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml #xml文件位置

retry:
  max-attempts: 3 # 最大重试次数
  init-interval: 1000 # 初始延迟时间，单位 ms
  multiplier: 2 # 每次重试间隔加倍（每次乘以 2）

logging:
  level:
    wcg.yhm.comment.biz.mapper: debug
