spring:
  application:
    name: ymm-distributed-id-generator # 应用名称
  profiles:
    active: dev # 默认激活 dev 本地开发环境
  cloud:
    nacos:
      discovery:
        enabled: true # 启用服务发现
        group: "${NACOS_GROUP:DEFAULT_GROUP}"
        namespace: "${NACOS_NAMESPACE:}"
        server-addr: "${NACOS_SERVER_ADDR:localhost:8848}"
