spring:
  application:
    name: ymm-data-align
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        enabled: true # 启用服务发现
        group: "${NACOS_GROUP:DEFAULT_GROUP}"
        namespace: "${NACOS_NAMESPACE:}"
        server-addr: "${NACOS_SERVER_ADDR:localhost:8848}"
      config:
        group: "${NACOS_GROUP:DEFAULT_GROUP}"
        server-addr: "${NACOS_SERVER_ADDR:localhost:8848}"
        prefix: ${spring.application.name} #dataId 前缀 用当前应用名
        file-extension: yaml #配置文件格式
        namespace: "${NACOS_NAMESPACE:}"
        refresh-enabled: true #动态刷新
