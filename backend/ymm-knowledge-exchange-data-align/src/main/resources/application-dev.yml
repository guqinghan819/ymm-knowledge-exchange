spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${DB_URL:jdbc:mysql://localhost:3306/ymm_knowledge_exchange?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}"
    password: "${DB_PASSWORD:}"
    username: "${DB_USERNAME:root}"
  data:
    redis:
      database: 0
      host: "${REDIS_HOST:localhost}"
      port: 6379
      password: "${REDIS_PASSWORD:}"
      timeout: 5000
      #连接池配置
      lettuce:
        pool:
          max-active: 200 # 连接池最大连接数
          max-wait: -1ms # 连接池最大阻塞等待时间（使用负值表示没有限制）
          min-idle: 0 # 连接池中的最小空闲连接
          max-idle: 10 # 连接池中的最大空闲连接

xxl:
  job:
    adminAddresses: "${XXL_JOB_ADMIN_ADDRESSES:http://localhost:8080/xxl-job-admin}"
    accessToken: "${XXL_JOB_ACCESS_TOKEN:}"
    appName: xxl-job-executor-ymm # 需要和 xxl-job 上创建的执行器名称保持一致
    ip: # 执行器 ip, 为空表示自动获取 ip
    port: 10001 # 执行器端口号
    logPath: /data/applogs/xxl-job/jobhandler # 执行器日志存放路径
    logRetentionDays: 30 # 日志保留时间（单位：天）


table:
  shards: 3 #日增量表分片数

rocketmq:
  name-server: "${ROCKETMQ_NAME_SERVER:localhost:9876}"
  consumer: #消费者
    group: ymm_group
    pull-batch-size: 5

