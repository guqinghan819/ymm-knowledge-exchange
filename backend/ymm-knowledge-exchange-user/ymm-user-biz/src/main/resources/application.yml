server:
  port: 8083
spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 150MB
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml #xml文件位置

  #接口生成工具配置
  # springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: wcg.yhm.user.biz.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    wcg.yhm.user.biz.mapper: debug
